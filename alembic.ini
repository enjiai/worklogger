[alembic]
script_location = alembic
# This URL will be overridden by the settings module in env.py
sqlalchemy.url = postgresql://postgres:postgres@127.0.0.1/work_logger

[alembic:environment]
# This URL will be overridden by the settings module in env.py
sqlalchemy.url = postgresql://postgres:postgres@127.0.0.1/work_logger

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers = console
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
